---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: previewenvironments.preview.rigo.dev
spec:
  group: preview.rigo.dev
  names:
    kind: PreviewEnvironment
    listKind: PreviewEnvironmentList
    plural: previewenvironments
    shortNames:
    - pe
    - preview
    singular: previewenvironment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repository
      name: PR
      type: string
    - jsonPath: .spec.pullRequest
      name: '#'
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.expiresAt
      name: Expira
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Idade
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PreviewEnvironment é um ambiente efêmero de pull request.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreviewEnvironmentSpec descreve o ambiente efêmero de um
              pull request.
            properties:
              commit:
                description: 'Commit é o SHA que gerou a imagem. Só informativo: vira
                  label e evento.'
                type: string
              env:
                description: |-
                  Env são as variáveis do container, e só valores literais.

                  valueFrom é recusado de propósito. Ele resolve no namespace do pod, que
                  é onde o operator acabou de copiar o pull secret — quem escreve o CR
                  passaria a ler, dentro de uma imagem que ele mesmo escolheu, qualquer
                  Secret que o operator tenha alcançado. O operator não tem como saber se
                  quem pediu tem direito àquele segredo, então não empresta o acesso dele.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: Name of the environment variable. Must be a C_IDENTIFIER.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-validations:
                - message: env aceita só valor literal; valueFrom resolveria no namespace
                    do preview com o acesso do operator
                  rule: self.all(e, !has(e.valueFrom))
              image:
                description: |-
                  Image é a imagem já construída pelo CI do repositório de origem.
                  O operator não constrói nada — quem constrói é quem já tem o contexto.
                minLength: 1
                type: string
              imagePullSecrets:
                description: ImagePullSecrets são copiados para o namespace do preview
                  antes do deploy.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              port:
                default: 8080
                description: Port é a porta que o container escuta.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              pullRequest:
                description: |-
                  PullRequest é o número do PR que pediu o ambiente.

                  Imutável, pelo mesmo motivo de repository.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: 'pullRequest é imutável: o namespace do preview deriva
                    dele'
                  rule: self == oldSelf
              replicas:
                default: 1
                description: Replicas do deployment do preview.
                format: int32
                minimum: 0
                type: integer
              repository:
                description: |-
                  Repository é o repositório de origem no formato owner/name.

                  Imutável: o nome do namespace do preview deriva deste campo. Deixar
                  editar troca o namespace de destino e abandona o antigo, com o workload
                  dentro, consumindo quota sem nenhum objeto que aponte para ele.
                pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                type: string
                x-kubernetes-validations:
                - message: 'repository é imutável: o namespace do preview deriva dele'
                  rule: self == oldSelf
              resources:
                description: Resources do container. Sem valor, herda o default do
                  manager.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              subdomain:
                description: |-
                  Subdomain é o rótulo que precede o domínio base do manager. Vazio, o
                  operator calcula um a partir do repositório e do número do PR.

                  É rótulo e não hostname inteiro de propósito. Aceitando hostname
                  completo, quem abre o pull request escolheria qualquer nome no ingress
                  controller compartilhado — inclusive um nome interno que ainda não tem
                  Ingress — e passaria a servi-lo a partir do container do PR. O domínio
                  é decisão do cluster, e o cluster a mantém.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              ttl:
                default: 24h
                description: |-
                  TTL conta a partir da criação do objeto. Vencido, o ambiente é derrubado.
                  Formato do time.ParseDuration do Go: "24h", "1h30m", "90m".

                  É string e não metav1.Duration de propósito, e essa é a diferença entre
                  um objeto ruim e um cluster parado. metav1.Duration decodifica dentro do
                  informer com time.ParseDuration; um "24 horas" digitado em qualquer
                  namespace faria a LIST inteira falhar, em laço, e o controller pararia
                  de reconciliar TODOS os ambientes do cluster — sem nada no status de
                  ninguém, só no log do manager. Com string, o pior caso é um ambiente
                  cair no TTL padrão.

                  O campo antes era ponteiro por causa do default: metav1.Duration é
                  struct e `omitempty` não omite struct, então o campo ia na requisição
                  como "0s" mesmo sem ninguém ter pedido e o default do CRD nunca era
                  aplicado. String vazia omite sozinha.
                  O teto e o piso vão em CEL porque o pattern não sabe comparar grandezas:
                  "-5h" e "9999h" casam com o formato e são igualmente ruins — o primeiro
                  nasce vencido, o segundo transforma ambiente efêmero em permanente.
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$
                type: string
                x-kubernetes-validations:
                - message: ttl precisa ser positivo e no máximo 168h
                  rule: duration(self) > duration('0s') && duration(self) <= duration('168h')
            required:
            - image
            - pullRequest
            - repository
            type: object
          status:
            description: PreviewEnvironmentStatus é o que o controller publica de
              volta.
            properties:
              conditions:
                description: Conditions carregam o detalhe que a phase não cabe.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              expiresAt:
                description: ExpiresAt é o instante em que o TTL vence.
                format: date-time
                type: string
              namespace:
                description: Namespace é onde o ambiente foi materializado.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration é a generation do spec que este status responde.
                  Sem isso, quem observa não sabe se está lendo status velho.
                format: int64
                type: integer
              phase:
                description: Phase resume o estado em uma palavra.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Expired
                - Terminating
                - Failed
                type: string
              readyReplicas:
                description: ReadyReplicas é o que o Deployment do preview reporta.
                format: int32
                type: integer
              url:
                description: URL é o endereço público, quando há Ingress.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
